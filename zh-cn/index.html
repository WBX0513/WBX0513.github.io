<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBX0513 - GitHub Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f6f8fa;
            color: #24292f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            background: #fff;
            border-bottom: 1px solid #d0d7de;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #0969da;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 18px;
        }

        .navbar span {
            font-weight: 600; font-size: 16px; color: #24292f;
        }

        .navbar .nav-right {
            margin-left: auto;
            display: flex; align-items: center; gap: 16px;
        }

        .lang-switch {
            display: flex; align-items: center; gap: 4px;
        }

        .lang-switch a {
            font-size: 13px; color: #57606a; text-decoration: none;
            padding: 4px 8px; border-radius: 4px;
            transition: all 0.15s ease;
        }

        .lang-switch a:hover { color: #0969da; background: #f6f8fa; }
        .lang-switch a.active { color: #fff; background: #0969da; font-weight: 600; }

        .container {
            width: 100%; max-width: 900px; padding: 0 24px; margin-top: 60px;
        }

        .hero { text-align: center; margin-bottom: 50px; }

        .avatar {
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 4px solid #d0d7de;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #0969da, #1a7f37);
            display: flex; align-items: center; justify-content: center;
            font-size: 52px; font-weight: bold;
            color: #fff;
            margin-left: auto; margin-right: auto;
            box-shadow: 0 8px 24px rgba(9, 105, 218, 0.2);
        }

        .hero h1 { font-size: 36px; color: #24292f; margin-bottom: 8px; }
        .hero .username {
            font-size: 20px; color: #0969da; font-weight: 400; margin-bottom: 16px;
        }
        .hero .bio {
            font-size: 16px; color: #57606a; max-width: 500px;
            margin: 0 auto 24px; line-height: 1.6;
        }

        .stats {
            display: flex; justify-content: center; gap: 32px;
            margin-bottom: 50px; flex-wrap: wrap;
        }

        .stat-item { text-align: center; }
        .stat-item .number { font-size: 28px; font-weight: 700; color: #24292f; }
        .stat-item .label { font-size: 13px; color: #57606a; margin-top: 4px; }

        .section { margin-bottom: 40px; }

        .section-title {
            font-size: 20px; font-weight: 600; color: #24292f;
            margin-bottom: 16px; padding-bottom: 8px;
            border-bottom: 1px solid #d0d7de;
            display: flex; align-items: center; gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px; height: 20px;
            background: #0969da; border-radius: 2px;
        }

        .repo-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .repo-card {
            background: #fff; border: 1px solid #d0d7de;
            border-radius: 10px; padding: 20px;
            transition: all 0.2s ease;
            cursor: pointer; text-decoration: none; color: inherit;
        }

        .repo-card:hover {
            border-color: #0969da; transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(9, 105, 218, 0.1);
        }

        .repo-card h3 { font-size: 16px; color: #0969da; margin-bottom: 8px; }
        .repo-card p { font-size: 13px; color: #57606a; line-height: 1.5; margin-bottom: 12px; }
        .repo-meta { display: flex; gap: 16px; font-size: 12px; color: #57606a; }
        .repo-meta span { display: flex; align-items: center; gap: 4px; }

        .skills { display: flex; flex-wrap: wrap; gap: 10px; }

        .skill-tag {
            background: #f6f8fa; border: 1px solid #d0d7de;
            border-radius: 20px; padding: 6px 16px;
            font-size: 13px; color: #0969da;
            transition: all 0.2s ease;
        }

        .skill-tag:hover { background: #ddf4ff; border-color: #0969da; }

        .social-links {
            display: flex; justify-content: center; gap: 20px;
            margin-top: 16px; flex-wrap: wrap;
        }

        .social-link {
            display: flex; align-items: center; gap: 6px;
            color: #57606a; text-decoration: none; font-size: 14px;
            transition: color 0.2s;
        }

        .social-link:hover { color: #0969da; }

        footer {
            margin-top: 60px; padding: 32px 24px;
            text-align: center; border-top: 1px solid #d0d7de;
            width: 100%; color: #8c959f; font-size: 13px;
        }

        footer a { color: #0969da; text-decoration: none; }

        @media (max-width: 600px) {
            .repo-list { grid-template-columns: 1fr; }
            .hero h1 { font-size: 28px; }
            .stats { gap: 16px; }
        }
    </style>
</head>
<body>
